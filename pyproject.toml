[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-ergo"
description = "Ergonomic helpers and descriptors for SQLAlchemy ORM models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "no1sebomb", email = "noisebombch@gmail.com" }]
keywords = ["sqlalchemy", "orm", "column_property", "descriptor", "relationship"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["SQLAlchemy>=2.0,<3.0"]
dynamic = ["version"]

[project.optional-dependencies]
# Async support relies on SQLAlchemy's asyncio extension.
asyncio = ["SQLAlchemy[asyncio]>=2.0,<3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "coverage[toml]>=7.5",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/no1sebomb/sqlalchemy-ergo"
Repository = "https://github.com/no1sebomb/sqlalchemy-ergo"
Issues = "https://github.com/no1sebomb/sqlalchemy-ergo/issues"
Changelog = "https://github.com/no1sebomb/sqlalchemy-ergo/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sqlalchemy_ergo/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_ergo"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning:aiosqlite.*"]

[tool.coverage.run]
source = ["sqlalchemy_ergo"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Reference implementation kept for comparison, not part of the package
extend-exclude = ["legacy.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TC",       # flake8-type-checking
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Test models legitimately shadow builtins, and fixture annotations are needed
# at runtime-ish by pytest tooling, so keep imports where they are.
"tests/*" = ["N806", "RUF012", "TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
exclude = ["legacy\\.py"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
